{{define "head"}}
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ .csrf_token }}">
    <meta name="base-path" content="{{ .base_path }}">
    <link rel="stylesheet" href="{{ .base_path }}assets/ant-design-vue@1.7.2/antd.min.css">
    <link rel="stylesheet" href="{{ .base_path }}assets/css/custom.css?{{ .cur_ver }}">
    <script nonce="{{ .csp_nonce }}">
        (function() {
            try {
                if (localStorage.getItem('xui-theme') === 'dark') {
                    document.body.classList.add('dark-theme');
                }
            } catch (e) {}
        })();
        function toggleTheme() {
            var isDark = document.body.classList.toggle('dark-theme');
            try { localStorage.setItem('xui-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        }
    </script>
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
    <title>{{.title}}</title>
</head>
{{end}}
