<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    @media (min-width: 769px) {
        .ant-layout-content {
            margin: 24px 16px;
        }
    }
    .detect-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
    }
    .detect-meta {
        color: rgba(0, 0, 0, 0.45);
        margin-top: 8px;
    }
    .detect-value {
        font-weight: 500;
        word-break: break-all;
    }
    .detect-card {
        margin-bottom: 16px;
    }
    .detect-info-row {
        display: flex;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
    }
    .detect-info-row:last-child {
        border-bottom: none;
    }
    .detect-info-label {
        flex: 0 0 88px;
        color: rgba(0, 0, 0, 0.45);
    }
</style>
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="spinningIP || spinningUnlock || spinningProtocols || spinningBackRoute" :delay="200" tip="检测中"/>
            <transition name="list" appear>
                <div>
                    <a-card class="detect-card" title="网络检测">
                        <div class="detect-toolbar">
                            <a-button type="primary" icon="thunderbolt" @click="detectAll">全部检测</a-button>
                            <a-button icon="global" @click="detectIP">检测 IP</a-button>
                            <a-button icon="api" @click="detectUnlock">检测解锁</a-button>
                            <a-button icon="check-circle" @click="detectProtocols">检测现有协议</a-button>
                            <a-button icon="fork" @click="detectBackRoute">回程路由</a-button>
                            <a-checkbox v-model="force">强制刷新缓存</a-checkbox>
                        </div>
                        <a-alert type="info" show-icon
                                 message="检测从服务器发起"
                                 description="结果表示当前 VPS 到外部平台的网络可达性和地区信息，外部平台策略变化可能导致结果仅供参考。"/>
                    </a-card>

                    <a-row :gutter="16">
                        <a-col :xs="24" :lg="10">
                            <a-card class="detect-card" title="IP 信息">
                                <template v-if="ip.checkedAt || ip.error">
                                    <a-alert v-if="ip.error" type="warning" show-icon style="margin-bottom: 12px"
                                             :message="ip.error"/>
                                    <div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">IP</span>
                                            <span class="detect-value">[[ ip.ip || '-' ]]</span>
                                        </div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">国家/城市</span>
                                            <span>[[ ip.country || '-' ]] [[ ip.city || '' ]]</span>
                                        </div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">ASN</span>
                                            <span>[[ ip.asn || '-' ]]</span>
                                        </div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">组织</span>
                                            <span>[[ ip.org || '-' ]]</span>
                                        </div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">类型</span>
                                            <span>[[ ip.ipType || '-' ]]</span>
                                        </div>
                                        <div class="detect-info-row">
                                            <span class="detect-info-label">来源</span>
                                            <span>[[ ip.provider || '-' ]]</span>
                                        </div>
                                    </div>
                                    <div class="detect-meta">
                                        [[ ip.cached ? '缓存结果' : '实时检测' ]] | [[ ip.elapsedMs || 0 ]] ms | [[ formatTime(ip.checkedAt) ]]
                                    </div>
                                </template>
                                <a-empty v-else description="尚未检测 IP"></a-empty>
                            </a-card>
                        </a-col>
                        <a-col :xs="24" :lg="14">
                            <a-card class="detect-card" title="平台可达性">
                                <a-list v-if="unlock.length" item-layout="horizontal" :data-source="unlock">
                                    <a-list-item slot="renderItem" slot-scope="item">
                                        <a-list-item-meta>
                                            <template slot="title">
                                                [[ item.name ]]
                                                <a-tag :color="statusColor(item.status)">[[ statusText(item.status) ]]</a-tag>
                                                <a-tag v-if="item.region">[[ item.region ]]</a-tag>
                                            </template>
                                            <template slot="description">
                                                [[ item.hint || '-' ]]
                                                <span class="detect-meta"> | [[ item.cached ? '缓存' : '实时' ]] | [[ item.elapsedMs || 0 ]] ms | [[ formatTime(item.checkedAt) ]]</span>
                                            </template>
                                        </a-list-item-meta>
                                    </a-list-item>
                                </a-list>
                                <a-empty v-else description="尚未检测平台"></a-empty>
                            </a-card>
                            <a-card class="detect-card" title="现有协议配置">
                                <template v-if="protocols.inbounds && protocols.inbounds.length">
                                    <a-alert v-if="protocols.valid" type="success" show-icon style="margin-bottom: 12px"
                                             message="当前已配置入站通过 Xray 配置验证"/>
                                    <a-alert v-else type="error" show-icon style="margin-bottom: 12px"
                                             :message="protocols.error || 'Xray 配置验证失败'"/>
                                    <a-list item-layout="horizontal" :data-source="protocols.inbounds">
                                        <a-list-item slot="renderItem" slot-scope="item">
                                            <a-list-item-meta>
                                                <template slot="title">
                                                    [[ item.protocol ]] : [[ item.port ]]
                                                    <a-tag>[[ item.network || '-' ]]</a-tag>
                                                    <a-tag>[[ item.security || 'none' ]]</a-tag>
                                                </template>
                                                <template slot="description">[[ item.tag ]]</template>
                                            </a-list-item-meta>
                                        </a-list-item>
                                    </a-list>
                                </template>
                                <a-empty v-else description="尚未检测现有协议"></a-empty>
                            </a-card>
                            <a-card class="detect-card" title="三网回程路由">
                                <a-alert v-if="backRouteError" type="warning" show-icon style="margin-bottom: 12px"
                                         :message="backRouteError"/>
                                <a-table v-if="backRoute.length" :columns="backRouteColumns" :data-source="backRoute"
                                         :pagination="false" size="small" row-key="city"/>
                                <a-empty v-else description="尚未检测回程路由"></a-empty>
                            </a-card>
                        </a-col>
                    </a-row>
                </div>
            </transition>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
<script nonce="{{ .csp_nonce }}">
    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            siderDrawer,
            spinningIP: false,
            spinningUnlock: false,
            spinningProtocols: false,
            spinningBackRoute: false,
            force: false,
            ip: {},
            unlock: [],
            protocols: {},
            backRoute: [],
            backRouteError: '',
            backRouteColumns: [
                { title: '城市', dataIndex: 'city', key: 'city' },
                { title: '电信', dataIndex: 'telecom', key: 'telecom' },
                { title: '联通', dataIndex: 'unicom', key: 'unicom' },
                { title: '移动', dataIndex: 'mobile', key: 'mobile' },
            ],
        },
        methods: {
            async detectIP() {
                this.spinningIP = true;
                const msg = await HttpUtil.post('/xui/detect/ip', { force: this.force });
                this.spinningIP = false;
                if (msg.success) this.ip = msg.obj || {};
            },
            async detectUnlock() {
                this.spinningUnlock = true;
                const msg = await HttpUtil.post('/xui/detect/unlock', { force: this.force });
                this.spinningUnlock = false;
                if (msg.success) this.unlock = msg.obj || [];
            },
            async detectProtocols() {
                this.spinningProtocols = true;
                const msg = await HttpUtil.post('/xui/detect/protocols');
                this.spinningProtocols = false;
                if (msg.success) this.protocols = msg.obj || {};
            },
            async detectAll() {
                await Promise.all([this.detectIP(), this.detectUnlock(), this.detectProtocols(), this.detectBackRoute()]);
            },
            async detectBackRoute() {
                this.spinningBackRoute = true;
                this.backRouteError = '';
                const msg = await HttpUtil.post('/xui/detect/backroute');
                this.spinningBackRoute = false;
                if (msg.success) {
                    this.backRoute = msg.obj || [];
                    if (!this.backRoute.length) this.backRouteError = '未检测到回程路由，请确认服务器已安装 mtr';
                } else {
                    this.backRouteError = msg.msg || '检测失败';
                }
            },
            statusColor(status) {
                if (status === 'unlocked') return 'green';
                if (status === 'blocked') return 'red';
                if (status === 'timeout') return 'orange';
                return 'default';
            },
            statusText(status) {
                if (status === 'unlocked') return '可用';
                if (status === 'blocked') return '受限';
                if (status === 'timeout') return '超时';
                return '未知';
            },
            formatTime(timestamp) {
                if (!timestamp) return '-';
                return moment(timestamp * 1000).format('YYYY-MM-DD HH:mm:ss');
            },
        },
        mounted() {
            this.detectIP();
            this.detectProtocols();
            this.detectUnlock();
        },
    });
</script>
</body>
</html>
